<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог услуг</title>
    <!-- Официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
        }
        h2 { text-align: center; margin-bottom: 20px; }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .info p { margin: 0; font-size: 13px; opacity: 0.7; }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>🚀 Каталог услуг</h2>
    
    <div class="card">
        <div class="info">
            <h3>Telegram Mini App</h3>
            <p>Полноценный веб-сервис внутри бота</p>
        </div>
        <button onclick="orderService('Telegram Mini App ($250)')">Заказать</button>
    </div>

    <div class="card">
        <div class="info">
            <h3>Автоматизация / Парсинг</h3>
            <p>Скрипты для сбора данных и отчетов</p>
        </div>
        <button onclick="orderService('Автоматизация ($150)')">Заказать</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран

        function orderService(serviceName) {
            let userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 0;
            
            fetch('/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: userId,
                    service: serviceName
                })
            })
            .then(response => response.json())
            .then(data => {
                tg.showAlert(`✅ Успешно! Вы заказали: ${serviceName}`);
                tg.close();
            })
            .catch(error => {
                tg.showAlert('❌ Ошибка отправки заказа.');
            });
        }
    </script>
</body>
</html>
